<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">事故事件的处理与下一步控制</title>
<desc id="desc">接触事实由内核产生，响应操作通过统一命令入口执行。</desc>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8Z" fill="#177c79"/>
</marker>
<marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8Z" fill="#93661f"/>
</marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="40" font-size="22" fill="#243747" text-anchor="start" font-weight="600">事故事件的处理与下一步控制</text>
<text x="32" y="69" font-size="15" fill="#607585" text-anchor="start" font-weight="400">接触事实由内核产生，响应操作通过统一命令入口执行。</text>
<rect x="40" y="150" width="300" height="90" rx="12" fill="#e8f2f1" stroke="#177c79"/>
<text x="190" y="189" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">接触、停驶与占用</text>
<text x="190" y="215" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">内核产生实际事实</text>
<rect x="435" y="150" width="320" height="90" rx="12" fill="#e8f2f1" stroke="#177c79"/>
<text x="595" y="189" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">带版本的事故事件</text>
<text x="595" y="215" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">对象、时刻及状态版本</text>
<path d="M340 195 L435 195" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="65" y="355" width="300" height="95" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="215" y="396.5" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">内置场景选项</text>
<text x="215" y="422.5" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">明确配置的事故后暂停</text>
<rect x="450" y="355" width="300" height="95" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="600" y="396.5" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">Python 控制回调</text>
<text x="600" y="422.5" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">返回一批操作</text>
<rect x="835" y="355" width="300" height="95" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="985" y="396.5" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">GUI / 观察回调</text>
<text x="985" y="422.5" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">展示、统计或外部通知</text>
<path d="M595 240 L595 295 L215 295 L215 355" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M595 240 L595 355" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M595 295 L985 295 L985 355" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="255" y="535" width="320" height="85" rx="12" fill="#e8f2f1" stroke="#177c79"/>
<text x="415" y="571.5" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">统一命令入口</text>
<text x="415" y="597.5" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">校验并应用边界修改</text>
<path d="M215 450 L215 578 L255 578" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M600 450 L600 490 L415 490 L415 535" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="750" y="535" width="320" height="85" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="910" y="571.5" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">下一逻辑步</text>
<text x="910" y="597.5" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">按确认后的运行状态推进</text>
<path d="M575 578 L750 578" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="835" y="505" font-size="16" fill="#607585" text-anchor="start" font-weight="400">观察交付保持非阻塞</text>
<text x="65" y="679" font-size="17" fill="#607585" text-anchor="start" font-weight="400">必需控制回调完成后进入后续调度；暂停选项可以阻止下一步自动推进。</text>
</g>
</svg>
