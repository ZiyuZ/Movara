<path d="M1030 2131L1030 2244" fill="none" stroke="#d2dde3" stroke-width="1.6" stroke-dasharray="6 5"/>
<path d="M1340 2131L1340 2244" fill="none" stroke="#d2dde3" stroke-width="1.6" stroke-dasharray="6 5"/>
