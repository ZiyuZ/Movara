<text x="255" y="925" font-size="16" fill="#243747" text-anchor="middle" font-weight="400">本地结果对象</text>
<text x="65" y="979" font-size="16" fill="#607585" text-anchor="start" font-weight="400">用户代码计算动作或处理条件</text>
<path d="M100 1025 L410 1025" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
