<path d="M1340 461L1340 1109" fill="none" stroke="#d2dde3" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="65" y="483" font-size="17" fill="#607585" text-anchor="start" font-weight="400">单步输入已携带：应用将其关联到本连接的当步控制回合。</text>
