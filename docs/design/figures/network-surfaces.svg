<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"
    aria-labelledby="title desc">
    <title id="title">立交承载表面与空间连接</title>
    <desc id="desc">侧视示意：地面道路与桥面在水平位置上重叠，通过坡面连接。重叠位置的主体处于不同高度。</desc>
    <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0L8 4L0 8" fill="#177c79" />
        </marker>
    </defs>
    <rect width="960" height="420" rx="16" fill="#f8fafc" />
    <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243747">
        <text x="32" y="40" font-size="22" font-weight="bold">承载表面：高程与实际连接</text>
        <text x="32" y="69" font-size="15">侧视示意 · 几何比例仅用于说明</text>
        <path d="M65 300H895" stroke="#718797" stroke-width="14" />
        <path d="M65 300H330L590 150H895" stroke="#177c79" stroke-width="12" fill="none"
            stroke-linejoin="round" />
        <path d="M590 150H895" stroke="#cfe6e3" stroke-width="3" />
        <path d="M670 162V289M850 162V289" stroke="#b6c2cb" stroke-width="12" />
        <rect x="724" y="113" width="56" height="25" rx="5" fill="#177c79" />
        <rect x="724" y="263" width="56" height="25" rx="5" fill="#dba64d" />
        <path d="M752 150V260" stroke="#8c9eac" stroke-dasharray="5 5" />
        <text x="795" y="209" font-size="15">相同平面位置</text>
        <text x="795" y="233" font-size="15">不同高度</text>
        <text x="630" y="100" font-size="18">桥面表面</text>
        <text x="90" y="343" font-size="18">地面表面</text>
        <text x="360" y="190" font-size="18">连接坡面</text>
        <path d="M375 247L545 149" stroke="#177c79" stroke-width="2" marker-end="url(#arrow)" />
        <text x="32" y="389" font-size="16">定位结合三维位置与表面上下文；平面重叠本身不建立连接或接触。</text>
    </g>
</svg>