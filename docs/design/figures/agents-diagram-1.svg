<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"
    aria-labelledby="title desc">
    <title id="title">主体状态、行为与运动反馈</title>
    <desc id="desc">世界保存实际状态，Agent 根据允许的信息与自身记忆产生行为。</desc>
    <defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0L8 4L0 8Z" fill="#177c79" />
        </marker>
        <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0L8 4L0 8Z" fill="#93661f" />
        </marker>
    </defs>
    <rect width="100%" height="100%" rx="16" fill="#f8fafc" />
    <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
        <text x="32" y="40" font-size="22" fill="#243747" text-anchor="start" font-weight="600">
            主体状态、行为与运动反馈</text>
        <text x="32" y="69" font-size="15" fill="#607585" text-anchor="start" font-weight="400">世界保存实际状态，Agent
            根据允许的信息与自身记忆产生行为。</text>
        <rect x="35" y="125" width="275" height="380" rx="14" fill="#ffffff" stroke="#d2dde3" />
        <text x="53" y="154" font-size="17" fill="#607585" text-anchor="start" font-weight="600">
            世界状态</text>
        <rect x="365" y="125" width="365" height="380" rx="14" fill="#ffffff" stroke="#d2dde3" />
        <text x="383" y="154" font-size="17" fill="#607585" text-anchor="start" font-weight="600">
            Agent</text>
        <rect x="790" y="125" width="375" height="380" rx="14" fill="#ffffff" stroke="#d2dde3" />
        <text x="808" y="154" font-size="17" fill="#607585" text-anchor="start" font-weight="600">
            控制与运动</text>
        <rect x="58" y="183" width="228" height="112" rx="12" fill="#e2e9ee" stroke="none" />
        <path d="M70 239L274 239" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" />
        <g transform="translate(161 239) rotate(0)">
            <rect x="-26" y="-13" width="52" height="26" rx="7" fill="#177c79" />
            <path d="M8 -9L17 -7V7L8 9Z" fill="#cce4e1" />
            <path d="M-13 -8V8" stroke="#cce4e1" stroke-width="2" />
        </g>
        <text x="172" y="282" font-size="15" fill="#607585" text-anchor="middle" font-weight="400">
            实际位姿与运动</text>
        <rect x="65" y="365" width="215" height="90" rx="12" fill="#e8f2f1" stroke="#177c79" />
        <text x="172.5" y="404" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">
            实体状态</text>
        <text x="172.5" y="430" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">World
            当前版本</text>
        <rect x="402" y="190" width="290" height="82" rx="12" fill="#fff" stroke="#d2dde3" />
        <text x="547" y="225" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">
            观测与持续记忆</text>
        <text x="547" y="251" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">
