        <rect x="402" y="365" width="290" height="90" rx="12" fill="#e8f2f1" stroke="#177c79" />
        <text x="547" y="404" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">
            行为模型</text>
        <text x="547" y="430" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">
