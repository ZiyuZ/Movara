        <rect x="832" y="190" width="290" height="82" rx="12" fill="#fff" stroke="#d2dde3" />
        <text x="977" y="225" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">
            动作解析</text>
        <text x="977" y="251" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">
