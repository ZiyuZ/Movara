        <rect x="832" y="365" width="290" height="90" rx="12" fill="#e8f2f1" stroke="#177c79" />
        <text x="977" y="404" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">
            运动模型</text>
        <text x="977" y="430" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">
            能力约束与实际运动</text>
        <path d="M977 272 L977 365" fill="none" stroke="#177c79" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
        <rect x="832" y="540" width="290" height="88" rx="12" fill="#e8f2f1" stroke="#177c79" />
        <text x="977" y="578" font-size="19" fill="#243747" text-anchor="middle" font-weight="600">
            下一阶段实体状态</text>
        <text x="977" y="604" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">
            位姿、运动与执行反馈</text>
        <path d="M977 455 L977 540" fill="none" stroke="#177c79" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
        <rect x="839" y="55" width="276" height="52" rx="10" fill="#faf4e8" stroke="#d9c7a3" />
        <text x="977" y="88" font-size="17" fill="#93661f" text-anchor="middle" font-weight="400">GUI
            / API 临时控制</text>
        <path d="M977 108 L977 190" fill="none" stroke="#93661f" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold)" />
        <path d="M832 581 L547 581 L547 455" fill="none" stroke="#177c79" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"
            marker-end="url(#arr)" />
        <text x="679" y="566" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">
            反馈用于后续决策</text>
        <path d="M977 628 L977 659 L173 659 L173 455" fill="none" stroke="#177c79" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"
            marker-end="url(#arr)" />
        <text x="350" y="646" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">
            提交后更新世界状态</text>
    </g>
</svg>