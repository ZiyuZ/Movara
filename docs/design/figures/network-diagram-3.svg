<path d="M1001 270 L1001 730 L197 730 L197 615" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="520" y="718" font-size="16" fill="#607585" text-anchor="middle" font-weight="400">按版本与信息权限提供动态规划上下文</text>
