<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"
    aria-labelledby="title desc">
    <title id="title">Movara 世界与主体右手坐标系</title>
    <desc id="desc">从上方向下看，世界 X 向右、Y 向上，Z 朝向读者。主体朝向相对世界 X 轴逆时针转过正航向角，局部 X 向前、Y 向左、Z 向上。</desc>
    <defs>
        <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb" />
        </marker>
        <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
            <path d="M0 0 L8 4 L0 8 Z" fill="#15803d" />
        </marker>
        <marker id="orange-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0 L7 4 L0 8 Z" fill="#b45309" />
        </marker>
    </defs>
    <rect width="1000" height="480" rx="16" fill="#ffffff" />
    <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172033">
        <text x="40" y="43" font-size="25" font-weight="600">右手坐标系 · 平面俯视</text>
        <text x="40" y="76" font-size="17" fill="#526177">世界坐标保持固定；主体局部坐标随主体位姿变换。</text>
        <rect x="35" y="103" width="430" height="300" rx="12" fill="#f4f7fc" stroke="#dbe3ee" />
        <rect x="485" y="103" width="480" height="300" rx="12" fill="#f4faf5" stroke="#d6e8d9" />
        <text x="59" y="137" font-size="20" font-weight="600">世界坐标</text>
        <path d="M170 325 H405" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)" />
        <path d="M170 325 V160" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)" />
        <text x="383" y="354" font-size="19" fill="#1d4ed8">X</text>
        <text x="185" y="174" font-size="19" fill="#1d4ed8">Y</text>
        <circle cx="170" cy="325" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
        <circle cx="170" cy="325" r="3" fill="#2563eb" />
        <text x="71" y="355" font-size="17">原点 / Z 向外</text>
        <path d="M270 325 A100 100 0 0 0 257 275" fill="none" stroke="#b45309" stroke-width="2.5"
            marker-end="url(#orange-arrow)" />
        <path d="M170 325 L322 237" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" />
        <text x="283" y="280" font-size="17" fill="#92400e">正航向角</text>
        <text x="510" y="137" font-size="20" font-weight="600">主体局部坐标</text>
        <g transform="translate(695 292) rotate(-30)">
            <rect x="-100" y="-43" width="200" height="86" rx="17" fill="#e4ebf5" stroke="#526177"
                stroke-width="2" />
            <path d="M65 -35 V35" stroke="#9aabc0" stroke-width="3" />
        </g>
        <path d="M695 292 L859 197" stroke="#15803d" stroke-width="3" marker-end="url(#green-arrow)" />
        <path d="M695 292 L635 188" stroke="#15803d" stroke-width="3" marker-end="url(#green-arrow)" />
        <text x="849" y="178" font-size="18" fill="#166534">局部 X：前</text>
        <text x="535" y="177" font-size="18" fill="#166534">局部 Y：左</text>
        <circle cx="695" cy="292" r="9" fill="#ffffff" stroke="#15803d" stroke-width="2" />
        <circle cx="695" cy="292" r="3" fill="#15803d" />
        <path d="M695 305 V351" stroke="#64748b" stroke-width="1.5" />
        <text x="675" y="379" font-size="17">主体原点 / 局部 Z 向外</text>
        <text x="40" y="439" font-size="17" fill="#526177">圆点符号表示 Z 轴朝向读者；长度单位 m，角度单位 rad。图为示意。</text>
    </g>
</svg>