<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">地图查询、规划与动作执行</title>
<desc id="desc">从固定版本输入到下一状态提交；策略按需要使用查询与规划。</desc>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8Z" fill="#177c79"/>
</marker>
<marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8Z" fill="#93661f"/>
</marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="40" font-size="22" fill="#243747" text-anchor="start" font-weight="600">地图查询、规划与动作执行</text>
<text x="32" y="69" font-size="15" fill="#607585" text-anchor="start" font-weight="400">从固定版本输入到下一状态提交；策略按需要使用查询与规划。</text>
<rect x="15" y="110" width="170" height="50" rx="12" fill="#e8f2f1" stroke="#177c79"/>
<text x="100" y="141" font-size="17" fill="#243747" text-anchor="middle" font-weight="600">地图 / 环境查询</text>
<path d="M100 160L100 725" fill="none" stroke="#d2dde3" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="265" y="110" width="170" height="50" rx="12" fill="#e8f2f1" stroke="#177c79"/>
<text x="350" y="141" font-size="17" fill="#243747" text-anchor="middle" font-weight="600">规划工具</text>
<path d="M350 160L350 725" fill="none" stroke="#d2dde3" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="515" y="110" width="170" height="50" rx="12" fill="#e8f2f1" stroke="#177c79"/>
<text x="600" y="141" font-size="17" fill="#243747" text-anchor="middle" font-weight="600">Agent 策略</text>
<path d="M600 160L600 725" fill="none" stroke="#d2dde3" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="765" y="110" width="170" height="50" rx="12" fill="#e8f2f1" stroke="#177c79"/>
<text x="850" y="141" font-size="17" fill="#243747" text-anchor="middle" font-weight="600">运动执行</text>
<path d="M850 160L850 725" fill="none" stroke="#d2dde3" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="1015" y="110" width="170" height="50" rx="12" fill="#e8f2f1" stroke="#177c79"/>
<text x="1100" y="141" font-size="17" fill="#243747" text-anchor="middle" font-weight="600">World</text>
<path d="M1100 160L1100 725" fill="none" stroke="#d2dde3" stroke-width="1.6" stroke-dasharray="6 5"/>
<path d="M1100 210 L600 210" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="850" y="200" font-size="16" fill="#243747" text-anchor="middle" font-weight="400">固定版本的允许观测与状态</text>
<path d="M600 285 L100 285" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="350" y="275" font-size="16" fill="#243747" text-anchor="middle" font-weight="400">位置、轮廓及查询范围</text>
<path d="M100 350 L600 350" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="350" y="340" font-size="16" fill="#243747" text-anchor="middle" font-weight="400">表面、投影、边界、连接与规则</text>
<path d="M600 425 L350 425" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="475" y="415" font-size="16" fill="#243747" text-anchor="middle" font-weight="400">起终点、能力、约束、代价与环境</text>
<path d="M350 490 L600 490" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="475" y="480" font-size="16" fill="#243747" text-anchor="middle" font-weight="400">候选路径或未找到路径</text>
<path d="M600 555 L665 555 L665 585 L600 585" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="678" y="575" font-size="16" fill="#243747" text-anchor="start" font-weight="400">选择、微调或采用自有策略</text>
<path d="M600 640 L850 640" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="725" y="630" font-size="16" fill="#243747" text-anchor="middle" font-weight="400">当前区间的动作</text>
<path d="M850 705 L1100 705" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="975" y="695" font-size="16" fill="#243747" text-anchor="middle" font-weight="400">实际运动与接触结果</text>
</g>
</svg>
