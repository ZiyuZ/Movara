<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">运行时地图的概念对象与引用关系</title>
<desc id="desc">左侧列出地图管理的对象，右侧说明对象间的主要引用。</desc>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8Z" fill="#177c79"/>
</marker>
<marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0L8 4L0 8Z" fill="#93661f"/>
</marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="40" font-size="22" fill="#243747" text-anchor="start" font-weight="600">运行时地图的概念对象与引用关系</text>
<text x="32" y="69" font-size="15" fill="#607585" text-anchor="start" font-weight="400">左侧列出地图管理的对象，右侧说明对象间的主要引用。</text>
<rect x="32" y="115" width="330" height="630" rx="14" fill="#ffffff" stroke="#d2dde3"/>
<text x="50" y="144" font-size="17" fill="#607585" text-anchor="start" font-weight="600">Map · 地图身份与版本</text>
<rect x="50" y="167" width="294" height="56" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="65" y="202" font-size="17" fill="#243747" text-anchor="start" font-weight="400">Surface · 承载表面</text>
<rect x="50" y="240" width="294" height="56" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="65" y="275" font-size="17" fill="#243747" text-anchor="start" font-weight="400">Area · 通行区域</text>
<rect x="50" y="313" width="294" height="56" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="65" y="348" font-size="17" fill="#243747" text-anchor="start" font-weight="400">Section · 通行区段</text>
<rect x="50" y="386" width="294" height="56" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="65" y="421" font-size="17" fill="#243747" text-anchor="start" font-weight="400">ReferenceCurve · 参考曲线</text>
<rect x="50" y="459" width="294" height="56" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="65" y="494" font-size="17" fill="#243747" text-anchor="start" font-weight="400">Connection · 连接关系</text>
<rect x="50" y="532" width="294" height="56" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="65" y="567" font-size="17" fill="#243747" text-anchor="start" font-weight="400">Rule · 交通规则</text>
<rect x="50" y="605" width="294" height="56" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="65" y="640" font-size="17" fill="#243747" text-anchor="start" font-weight="400">StaticObstacle · 静态障碍</text>
<text x="398" y="145" font-size="17" fill="#607585" text-anchor="start" font-weight="400">引用方向：持有引用的一方 → 被引用对象</text>
<rect x="390" y="178" width="775" height="78" rx="12" fill="#f4f7f9" stroke="#d2dde3"/>
<text x="408" y="207" font-size="18" fill="#177c79" text-anchor="start" font-weight="600">Area</text>
<path d="M552 201 L590 201" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="607" y="207" font-size="18" fill="#243747" text-anchor="start" font-weight="600">Surface</text>
<text x="408" y="237" font-size="16" fill="#607585" text-anchor="start" font-weight="400">一个或多个表面片段</text>
<rect x="390" y="268" width="775" height="78" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="408" y="297" font-size="18" fill="#177c79" text-anchor="start" font-weight="600">Section</text>
<path d="M552 291 L590 291" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="607" y="297" font-size="18" fill="#243747" text-anchor="start" font-weight="600">Area</text>
<text x="408" y="327" font-size="16" fill="#607585" text-anchor="start" font-weight="400">所属带状区域与有效范围</text>
<rect x="390" y="358" width="775" height="78" rx="12" fill="#f4f7f9" stroke="#d2dde3"/>
<text x="408" y="387" font-size="18" fill="#177c79" text-anchor="start" font-weight="600">Section</text>
<path d="M552 381 L590 381" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="607" y="387" font-size="18" fill="#243747" text-anchor="start" font-weight="600">ReferenceCurve</text>
<text x="408" y="417" font-size="16" fill="#607585" text-anchor="start" font-weight="400">中心参考曲线与边界</text>
<rect x="390" y="448" width="775" height="78" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="408" y="477" font-size="18" fill="#177c79" text-anchor="start" font-weight="600">Connection</text>
<path d="M552 471 L590 471" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="607" y="477" font-size="18" fill="#243747" text-anchor="start" font-weight="600">Area / Section</text>
<text x="408" y="507" font-size="16" fill="#607585" text-anchor="start" font-weight="400">连接端点及局部范围</text>
<rect x="390" y="538" width="775" height="78" rx="12" fill="#f4f7f9" stroke="#d2dde3"/>
<text x="408" y="567" font-size="18" fill="#177c79" text-anchor="start" font-weight="600">Connection</text>
<path d="M552 561 L590 561" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="607" y="567" font-size="18" fill="#243747" text-anchor="start" font-weight="600">ReferenceCurve</text>
<text x="408" y="597" font-size="16" fill="#607585" text-anchor="start" font-weight="400">可选的连接参考几何</text>
<rect x="390" y="628" width="775" height="78" rx="12" fill="#fff" stroke="#d2dde3"/>
<text x="408" y="657" font-size="18" fill="#177c79" text-anchor="start" font-weight="600">Rule</text>
<path d="M552 651 L590 651" fill="none" stroke="#177c79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="607" y="657" font-size="18" fill="#243747" text-anchor="start" font-weight="600">Area / Connection</text>
<text x="408" y="687" font-size="16" fill="#607585" text-anchor="start" font-weight="400">作用范围、对象与适用条件</text>
<text x="398" y="760" font-size="17" fill="#607585" text-anchor="start" font-weight="400">通行区段描述区域内部的连续部分，保留源数据对应关系。</text>
</g>
</svg>
