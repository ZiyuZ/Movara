name: 文档站

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/movara-app/docs/**'
      - '.github/docs-site/**'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'docs/**'
      - 'crates/movara-app/docs/**'
      - '.github/docs-site/**'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOVARA_REPOSITORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 准备隔离的站点工程
        run: |
          mkdir -p .local/docs-site/project
          cp -R .github/docs-site/. .local/docs-site/project/
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.4'
      - name: 安装文档构建依赖
        working-directory: .local/docs-site/project
        run: bun install --frozen-lockfile
      - name: 构建文档
        working-directory: .local/docs-site/project
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
        run: bun run docs:build
      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .local/docs-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
