<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="880" viewBox="0 0 1220 880" role="img"
    aria-labelledby="title desc">
    <title id="title">Movara 自定义标题栏与仿真工作区候选布局</title>
    <desc id="desc">
        紧凑的桌面窗口示意。顶部是包含应用标识、菜单、场景身份、拖动区和窗口按钮的自定义标题栏，其下为运行工具。左侧对象与图层，中间交通场景画布，右侧属性，底部事件与状态。用平直区域和小圆角控件表达科研工具的密度。</desc>
    <defs>
        <clipPath id="window">
            <rect x="40" y="110" width="1140" height="650" rx="8" />
        </clipPath>
        <clipPath id="canvas">
            <rect x="260" y="190" width="620" height="412" />
        </clipPath>
    </defs>
    <rect width="1220" height="880" rx="16" fill="#f8fafc" />
